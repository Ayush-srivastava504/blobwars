# Tuned for Postgres running in a ~256-300MB container on a 1GB RAM EC2 host,
# sharing the box with the Node backend. Do not copy these values onto a
# larger instance without re-tuning (shared_buffers etc. scale with RAM).

listen_addresses = '*'
max_connections = 20            # backend uses a small Prisma pool; keep this low to save memory

# Memory
shared_buffers = 64MB           # ~25% of the container's mem_limit is the usual guideline
effective_cache_size = 192MB    # hint only, no allocation — rest of container's mem_limit
work_mem = 4MB                  # per sort/hash operation; low because concurrency is low
maintenance_work_mem = 32MB

# WAL / checkpoints
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# Misc
random_page_cost = 1.1          # EBS gp3 is SSD-backed
logging_collector = off         # rely on docker logs instead of writing to disk
